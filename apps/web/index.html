<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="description" content="Aegon — diagramas C4 como código, con un lienzo moderno y pensado para IA." />
    <title>Aegon</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar el parpadeo.
      (function () {
        var pref = 'system';
        try { pref = JSON.parse(localStorage.getItem('aegon.prefs') || '{}').theme || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
