[package]
name = "aegon-desktop"
version = "0.1.0"
description = "Aegon — diagramas C4 como código"
authors = ["CrisD404"]
license = "MIT"
edition = "2021"
default-run = "aegon"

[[bin]]
name = "aegon"
path = "src/main.rs"

[lib]
name = "aegon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
